[project]
name = "formkiq-mcp-server"
version = "0.1.0"
description = "MCP server that exposes the FormKiQ OpenAPI spec and proxies selected FormKiQ API operations."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp[cli]>=1.27,<2",
    "pyyaml>=6.0",
]

[project.scripts]
formkiq-mcp-server = "server:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
