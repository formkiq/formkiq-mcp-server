[project]
name = "formkiq-mcp-server"
version = "0.1.0"
description = "MCP server that exposes the FormKiQ OpenAPI spec and proxies selected FormKiQ API operations."
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.14.2,<5",
    "certifi>=2026.10.18",
    "cryptography>=50.0.0",
    "httpx==0.28.1",
    "jsonschema>=4.20,<5",
    "mcp==1.30.0",
    "pyjwt[crypto]>=2.15.1,<3",
    "pyyaml==6.0.3",
    "starlette>=0.48,<2",
]

[dependency-groups]
dev = ["ruff==0.17.5"]

[project.scripts]
formkiq-mcp-server = "formkiq_mcp.server:main"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
packages = ["formkiq_mcp", "formkiq_mcp.data"]

[tool.setuptools.package-data]
"formkiq_mcp.data" = ["*.yaml", "*.json"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
