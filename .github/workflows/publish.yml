name: Publish Python package and MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'formkiq/formkiq-mcp-server'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
          python-version: "3.11"
          enable-cache: true
      - name: Check release tag and registry metadata
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          server = json.loads(Path("server.json").read_text())
          version = project["version"]
          if os.environ["RELEASE_REF"] != f"refs/tags/v{version}":
              raise SystemExit("Run publication only from the matching release tag.")
          if server["version"] != version or server["packages"][0]["version"] != version:
              raise SystemExit("Package and registry versions must match.")
          marker = f"<!-- mcp-name: {server['name']} -->"
          if marker not in Path("README.md").read_text():
              raise SystemExit("Missing official-registry ownership marker.")
          PY
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked python -m unittest discover -v
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/formkiq-mcp-server/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish through PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  registry:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: mcp-registry
      url: https://registry.modelcontextprotocol.io/?q=formkiq
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the matching PyPI release
        run: |
          python - <<'PYTHON'
          import json
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          server = json.loads(Path("server.json").read_text())
          package = server["packages"][0]
          url = f"https://pypi.org/pypi/{package['identifier']}/{package['version']}/json"
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      info = json.load(response)["info"]
                  if info["version"] != package["version"]:
                      raise SystemExit("Unexpected PyPI version.")
                  if f"mcp-name: {server['name']}" not in info["description"]:
                      raise SystemExit("Missing PyPI ownership marker.")
                  break
              except urllib.error.HTTPError as error:
                  if error.code != 404 or attempt == 11:
                      raise
                  time.sleep(5)
          PYTHON
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify the official MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Authenticate to the official MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish the official registry entry
        run: ./mcp-publisher publish
